{% extends "base.html" %}

{% block content %}
<section class="page-title">
    <p class="eyebrow">Quản trị</p>
    <h1>Quản lý người dùng</h1>
    <p>Admin có thể xem danh sách, đổi role và khóa/mở tài khoản người dùng.</p>
</section>

<section id="admin-users-guard" class="guard-card hidden"></section>

<section id="admin-users-loading" class="page-loading-card">
    <div class="loading-box">Đang kiểm tra quyền admin và tải danh sách người dùng...</div>
</section>

<section id="admin-users-content" class="panel hidden">
    <div class="toolbar">
        <button id="load-admin-users-btn" class="button" type="button">Tải lại người dùng</button>
    </div>
    <div id="admin-users-message" class="message" aria-live="polite"></div>
    <div id="admin-users-result" class="table-wrap">
        <div class="empty-state">Đang tải danh sách người dùng...</div>
    </div>
</section>
{% endblock %}

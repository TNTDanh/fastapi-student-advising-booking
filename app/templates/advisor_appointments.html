{% extends "base.html" %}

{% block content %}
<section class="page-title">
    <p class="eyebrow">Quản lý lịch hẹn</p>
    <h1>Quản lý lịch hẹn tư vấn</h1>
    <p>Advisor và admin có thể xem, xác nhận, hủy hoặc hoàn thành lịch hẹn.</p>
</section>

<section id="advisor-appointments-guard" class="guard-card hidden"></section>

<section id="advisor-appointments-content" class="panel hidden">
    <div class="toolbar">
        <button id="load-advisor-appointments-btn" class="button" type="button">Tải lại danh sách</button>
    </div>
    <div id="advisor-appointments-message" class="message" aria-live="polite"></div>
    <div id="advisor-appointments-result" class="table-wrap">
        <div class="empty-state">Đang tải danh sách lịch hẹn...</div>
    </div>
</section>
{% endblock %}

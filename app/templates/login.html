{% extends "base.html" %}

{% block content %}
<section class="auth-layout">
    <div class="auth-card">
        <p class="eyebrow">Xác thực tài khoản</p>
        <h1>Đăng nhập</h1>
        <p>Đăng nhập để hệ thống tự chuyển bạn đến trang phù hợp với vai trò.</p>

        <!-- Form không submit truyền thống, app.js xử lý bằng fetch -->
        <form id="login-form" class="form-card">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" placeholder="student@example.com" required>

            <label for="login-password">Mật khẩu</label>
            <input id="login-password" name="password" type="password" placeholder="Nhập mật khẩu" required>

            <button class="button button-wide" type="submit">Đăng nhập</button>
        </form>

        <div id="login-message" class="message" aria-live="polite"></div>
    </div>
</section>
{% endblock %}
